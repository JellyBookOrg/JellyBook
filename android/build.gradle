allprojects {
    repositories {
        google()
        mavenCentral()
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

def rootBuildDir = rootProject.layout.buildDirectory.get().dir('../../build')
rootProject.layout.buildDirectory.value(rootBuildDir)
subprojects {
    def subProjectBuildDir = rootBuildDir.dir(project.name)
    project.layout.buildDirectory.value(subProjectBuildDir)
}
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileSdkVersion flutter.compileSdkVersion
                buildToolsVersion "36.0.0"
            }
        }

        // sentry_flutter 8.7.0 hardcodes Kotlin languageVersion=1.4,
        // which is rejected by Kotlin 2.x compilers.
        if (project.name == "sentry_flutter") {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    languageVersion = "2.0"
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
